version: 2

# What Dependabot owns here:
#
#   github-actions   weekly. Minor and patch updates are grouped into one PR; a
#                    major update is its own PR and waits for a human.
#   pip              weekly. The pinned CI tooling (clang-format, gcovr,
#                    clang-tidy) in .github/requirements.
#   docker           weekly. The digest of the ClusterFuzzLite base image in .clusterfuzzlite.
#   vcpkg            monthly. The manifest's builtin-baseline. The baseline must
#                    name a commit that exists in the labs' vcpkg fork
#                    (iainchesworthlabs/vcpkg), which the fork's nightly sync
#                    normally guarantees. It rebuilds every dependency, so it is
#                    reviewed by hand and goes through the same required checks
#                    as anything else.
#
# Dependabot cannot see the runner image labels, the CMake and Ninja versions
# in the workflows, or the compilers; docs/ci.md lists those pins.
#
# Every PR targets develop, the trunk. The Policy job and the branch-names
# ruleset allow the dependabot/* prefix, which is not configurable.
#
# cooldown waits a week after a version is published before proposing it, so
# the community has time to catch a compromised release before this repository
# updates to it. (Security updates ignore it.)
#
# rebase-strategy is "disabled": develop does not require branches to be up to
# date (the merge queue makes each entry current), and an automatic rebase of
# every open PR on every merge would re-run the whole CI matrix. Ask for one
# with "@dependabot rebase" when a PR actually conflicts.

updates:
  - package-ecosystem: "github-actions"
    # The workflows, and the composite actions in .github/actions (their action
    # pins must move with the workflows').
    directories:
      - "/"
      - "/.github/actions/docs-site"
      - "/.github/actions/install-qt"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    open-pull-requests-limit: 3
    groups:
      # Everything below a major lands in one PR. Majors match no group, so
      # Dependabot raises each as its own PR.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # CI tooling that a workflow pip-installs from a pinned requirements file.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    groups:
      ci-tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # vcpkg: the manifest's builtin-baseline.
  - package-ecosystem: "vcpkg"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"

  # The image ClusterFuzzLite builds the fuzzers in, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
