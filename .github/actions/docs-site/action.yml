name: Build the documentation site
description: >-
  Builds the site from docs/ and mkdocs.yml with `mkdocs build --strict` into ./site, with MkDocs
  installed from the hash-locked .github/requirements/docs.txt, and then checks what the build
  produced. The strictness is more than MkDocs' default: mkdocs.yml turns a link that points nowhere,
  a heading anchor that is not there and a page that is not in the navigation into errors. The job must
  have checked the repository out. Used by docs.yml (pull requests and main) and by release.yml, so the
  two cannot disagree about what a good build is.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false

    # Python 3.13 and not whatever the image has: the lock was made for 3.10 and later, and every wheel
    # in it is checked against its hash. --no-build means nothing is compiled on the runner.
    - name: Install MkDocs (hash-locked)
      shell: bash
      run: |
        set -euo pipefail
        uv venv --python 3.13 "$RUNNER_TEMP/docs-venv"
        uv pip install --python "$RUNNER_TEMP/docs-venv/bin/python" --require-hashes --no-build \
          --requirement .github/requirements/docs.txt
        echo "$RUNNER_TEMP/docs-venv/bin" >> "$GITHUB_PATH"

    - name: Build the site (strict)
      shell: bash
      env:
        NO_MKDOCS_2_WARNING: "true"
      run: mkdocs build --strict --site-dir site

    # What the build is not able to say for itself.
    - name: Check the site
      shell: bash
      run: |
        set -euo pipefail
        status=0
        [ -f site/index.html ] || { echo "::error::site/index.html was not built"; status=1; }
        [ -f site/user-guide/index.html ] || { echo "::error::the user's guide was not built"; status=1; }
        # The standards are third-party documents and not this project's to publish (docs/licensing.md).
        pdfs=$(find site -iname '*.pdf' | head -5)
        if [ -n "$pdfs" ]; then
          echo "::error::a PDF would be published: $pdfs"
          status=1
        fi
        # A link to a missing picture is caught by MkDocs. A page count is held here as well, so that
        # an empty nav, or an exclude_docs pattern that removed the site, is noticed.
        pages=$(find site -name index.html | wc -l)
        if [ "$pages" -lt 40 ]; then
          echo "::error::only $pages pages were built; docs/ holds more than that"
          status=1
        fi
        echo "built $pages pages"
        exit "$status"
