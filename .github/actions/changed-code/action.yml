name: Changed code
description: >-
  Says whether a pull request or a merge queue entry changes anything but documentation. The output
  `code` is "true" unless every changed file is one that no build and no test reads (the list is in
  tools/ci/changed_code.ps1, and docs/ci.md, "Documentation-only changes", explains what it is for).
  Any other event (a push, a manual run, a schedule) is "true": those runs warm the caches and gate
  releases, and are not worth being clever about.

  The job needs a checkout of this repository with the tools/ci folder and, for a pull request, the
  merge commit and its first parent (fetch-depth: 2). A merge queue entry fetches its base commit
  itself. When the answer cannot be worked out (no diff, a failed fetch) it is "true".

outputs:
  code:
    description: '"true" when something other than documentation changed.'
    value: ${{ steps.diff.outputs.code }}

runs:
  using: composite
  steps:
    - name: Compare with the base
      id: diff
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: ./tools/ci/changed_code.ps1 -EventName $env:EVENT_NAME -MergeGroupBase $env:MERGE_GROUP_BASE
