name: Feature request
description: Suggest an idea for ARINC Data Loader
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything more than a small tweak, opening an issue first (like
        this one) before sinking time into a pull request avoids duplicated
        effort.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the loader does not support today? Name the ARINC 665 or 615A section if there is one.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this, and why you would prefer this approach.
