name: Fuzz

# The libFuzzer harnesses of libs/*/fuzz, tools/*/fuzz and apps/*/fuzz (docs/fuzzing.md). The pull request
# gate replays the seeds and the past crashes (the `Fuzz regression` job of ci.yml, a few seconds). This
# workflow fuzzes:
#
#   push to develop   60 seconds per target ("fuzz-short"), one run at a time with at most one waiting
#   schedule          10 minutes per target ("fuzz-nightly"), with the corpus kept between runs
#   manual            the seconds named, on the branch named
#
# The nightly run is split into shards: each shard is a job that builds the harnesses and fuzzes every Nth of
# them, so that a job stays well inside the 360 minutes a hosted job may run, and more targets can come. To add a
# shard, add a number to the list in `strategy.matrix.shard` below; nothing else changes, because a shard takes
# its place and the number of shards from the strategy. The short runs use one shard.
#
# A crash fails its shard and uploads the input that caused it as an artifact (`fuzz-crashes-shard-<n>`). The
# last job, named as the one job was before, ends with the result of all the shards, and on the schedule opens or
# updates one `nightly-analysis` issue. The fix adds the input to regressions/<target>/ beside the harness.

on:
  push:
    branches: [develop]
  schedule:
    # 14:47 UTC, the nightly hour of codeql.yml and static-analysis.yml plus the time they take.
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target.
        type: string
        default: "60"
      shards:
        description: >-
          How many shards to split the targets over. Use 3 for a long run (a shard may run for 150 minutes at most:
          3 shards fuzz 27 targets for 10 minutes each).
        type: choice
        options: ["1", "3"]
        default: "1"

concurrency:
  group: fuzz-${{ github.event_name == 'push' && 'push' || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  fuzz:
    name: Fuzz (Linux, Clang), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    runs-on: ubuntu-26.04
    # A shard of the nightly run fuzzes its share of the targets (27 of them, so 9 each of three shards) for ten
    # minutes one after the other: 90 minutes, plus the build and the cache. Keep the targets of a shard to 11 or
    # fewer, or add a shard (see the top of this file).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # The nightly run has three shards. A push and a manual run have one, unless the manual run asks for three.
        shard: ${{ fromJSON(github.event_name == 'schedule' && '[1, 2, 3]' || github.event_name == 'workflow_dispatch' && inputs.shards == '3' && '[1, 2, 3]' || '[1]') }}
    permissions:
      contents: read
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || github.event_name == 'workflow_dispatch' && inputs.seconds || '60' }}
      # Which of the shards this is (from 0) and how many there are: strategy.job-index and strategy.job-total.
      SHARD_INDEX: ${{ strategy.job-index }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          export-compiler: "false"

      - name: Install Clang
        uses: iainchesworthlabs/icl-common-infra/actions/setup-llvm@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

      - name: Configure and build
        run: |
          cmake --preset linux-fuzz
          cmake --build --preset linux-fuzz

      # The inputs found so far, kept between runs under a key of the shard's own (the newest entry of the
      # prefix is restored; each run saves a new one). A shard has the targets it fuzzes and no others, so each
      # keeps its own. The last prefix is the corpus of the runs before there were shards: the first run of a
      # shard starts from the newest entry of any kind, and the next step drops what is not the shard's.
      - name: Restore the fuzzing corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work
          key: fuzz-corpus-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}-
            fuzz-corpus-

      # The targets of this shard, each from the committed seeds and regressions plus what earlier runs found:
      # every SHARDS-th harness in name order, from the SHARD_INDEX-th. A new input goes to fuzz-work; a crash
      # leaves its input in fuzz-crashes.
      - name: Fuzz the targets of this shard
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          mkdir -p fuzz-work fuzz-crashes
          all=(build/linux-fuzz/bin/adl_fuzz_*)
          mine=()
          for i in "${!all[@]}"; do
            if (( i % SHARDS == SHARD_INDEX )); then
              mine+=("${all[$i]}")
            fi
          done
          echo "Shard $((SHARD_INDEX + 1)) of $SHARDS: ${#mine[@]} of ${#all[@]} targets"
          # What an older run left of a target that is not this shard's is not kept.
          for dir in fuzz-work/*/; do
            name="${dir%/}"
            name="${name##*/}"
            keep=0
            for exe in "${mine[@]}"; do
              [ "${exe##*/adl_fuzz_}" = "$name" ] && keep=1
            done
            if [ "$keep" -eq 0 ]; then
              rm -rf "$dir"
            fi
          done
          failed=0
          for exe in "${mine[@]}"; do
            target="${exe##*/adl_fuzz_}"
            # A harness is in libs/<lib>/fuzz, tools/<tool>/fuzz or apps/<app>/fuzz, and its seeds and regressions are beside it.
            dirs=(
              libs/*/fuzz/corpus/"$target" libs/*/fuzz/regressions/"$target"
              tools/*/fuzz/corpus/"$target" tools/*/fuzz/regressions/"$target"
              apps/*/fuzz/corpus/"$target" apps/*/fuzz/regressions/"$target"
            )
            mkdir -p "fuzz-work/$target"
            echo "::group::$target ($SECONDS_PER_TARGET s)"
            if ! "$exe" -max_total_time="$SECONDS_PER_TARGET" -artifact_prefix="fuzz-crashes/${target}-" \
                  "fuzz-work/$target" "${dirs[@]}"; then
              echo "::error::$target crashed; the input is in the fuzz-crashes-shard-$((SHARD_INDEX + 1)) artifact"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Save the fuzzing corpus
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work
          key: fuzz-corpus-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ github.run_id }}

      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-shard-${{ matrix.shard }}
          path: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 30

      - name: Save the vcpkg caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30

  # The one result of the shards, under the name the single job had. A shard that hits its time limit is cancelled,
  # not failed, and would otherwise pass unnoticed, so anything but success is a failure here. The issue is opened
  # (or appended to) once, from here, and not by each shard, which could open it twice.
  result:
    name: Fuzz (Linux, Clang)
    needs: [fuzz]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Report the failure
        if: needs.fuzz.result != 'success' && github.event_name == 'schedule'
        uses: iainchesworthlabs/icl-common-infra/actions/report-nightly-failure@7343cae74fb2028b995b39cdec14a58b0f37f2e8 # v0.1.30
        with:
          engine: libFuzzer
          detail: A fuzz target crashed, or a shard failed or ran out of time. A crashing input is in the fuzz-crashes-shard-<n> artifact of the run, n being the shard that crashed; add it to the regressions/<target>/ directory beside the harness (libs/<lib>/fuzz, tools/<tool>/fuzz or apps/<app>/fuzz) in the fix. For a timeout, see timeout-minutes in fuzz.yml.

      - name: Fail when a shard did not succeed
        if: needs.fuzz.result != 'success'
        env:
          SHARDS_RESULT: ${{ needs.fuzz.result }}
        run: |
          echo "::error::the fuzz shards ended as: ${SHARDS_RESULT}"
          exit 1
