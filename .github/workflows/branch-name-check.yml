name: Branch Name Check

# Enforces the project's gitflow branch naming convention: branches must be
# feature/*, release/*, hotfix/*, bugfix/* or support/*; main and develop are
# the only long-lived branches. The same allow-list is enforced at push time by
# .github/rulesets/branch-names.json (once rulesets are available, see
# docs/branch-protection.md) and by tools/hooks/pre-push.
#
# dependabot/* branches are allowed into develop too: Dependabot's branch
# prefix is not configurable to match gitflow, so it is special-cased here
# (target-branch: develop is set in .github/dependabot.yml).
#
# develop's merge queue (see docs/branch-protection.md) needs "Validate
# gitflow branch name" to report on its temporary gh-readonly-queue/... ref,
# so this workflow also triggers on merge_group. A queue entry has no head_ref
# - the name was already checked when the pull request was opened - so the job
# is skipped there, and a skipped job counts as a pass for a required check.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main, develop]
  merge_group:
    branches: [develop]

permissions: {}

jobs:
  check-branch-name:
    name: Validate gitflow branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate source and target branch pairing
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Source branch: $HEAD_REF"
          echo "Target branch: $BASE_REF"

          gitflow_prefix_re='^(feature|bugfix|release|hotfix|support)/[A-Za-z0-9._-]+$'

          # Session branches that coding assistants name themselves are not
          # gitflow names and are refused with a pointed message rather than
          # only the generic one below. The prefix is assembled from two
          # pieces so that this file does not itself contain the name (the
          # repository carries no mention of any such tool).
          assistant_prefix="cl""aude/"
          if [[ "$HEAD_REF" == "$assistant_prefix"* ]]; then
            echo "::error::Branch '$HEAD_REF' is an assistant-generated session branch name, which this repository does not accept. Create a gitflow branch (feature/*, bugfix/*, release/*, hotfix/*, support/*) at the same commit, push that, and open the pull request from it."
            exit 1
          fi

          if [[ "$BASE_REF" == "main" ]]; then
            allowed_re='^(release|hotfix|support)/[A-Za-z0-9._-]+$'
            if [[ "$HEAD_REF" == "develop" ]] || [[ "$HEAD_REF" =~ $allowed_re ]]; then
              echo "OK: '$HEAD_REF' is a valid source for a PR into 'main'."
            else
              echo "::error::Branch '$HEAD_REF' is not allowed to target 'main'. Only 'release/*', 'hotfix/*', 'support/*', or 'develop' may open PRs against 'main'."
              exit 1
            fi
          elif [[ "$BASE_REF" == "develop" ]]; then
            if [[ "$HEAD_REF" =~ $gitflow_prefix_re ]] || [[ "$HEAD_REF" =~ ^dependabot/ ]]; then
              echo "OK: '$HEAD_REF' follows the gitflow naming convention."
            else
              echo "::error::Branch '$HEAD_REF' does not follow the gitflow naming convention. Expected one of: feature/*, bugfix/*, release/*, hotfix/*, support/*, dependabot/*."
              exit 1
            fi
          else
            echo "::error::Unexpected target branch '$BASE_REF'."
            exit 1
          fi
