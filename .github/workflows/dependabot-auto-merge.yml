name: Dependabot auto-merge

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@6471335c6f49bfa69dbd5508da84478187d5952e # v0.1.7
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
