name: Dependabot auto-merge

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@320b0f8af8036ac854a5f33a5ee9df96b164b866 # v0.1.11
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
