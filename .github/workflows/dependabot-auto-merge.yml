name: Dependabot auto-merge

on:
  pull_request:
    branches: [develop]

permissions: {}

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/dependabot-auto-merge.yml@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
