name: Commit Policy

# This repository's rule: commit messages, pull request titles and pull request
# bodies carry NO attribution of any kind (no co-author trailers, no lines
# crediting a tool with the work, no tool, assistant or vendor names). The
# patterns and the reasoning are in tools/policy/check_text_policy.ps1 and
# docs/ci.md ("Commit and PR text policy"); the same script runs locally from
# tools/hooks/commit-msg.
#
# Pull request data reaches the script through the environment, never by
# interpolating ${{ }} into the shell: a title or body is attacker-controlled
# text.
#
# "Validate commit and PR text" is a required check on develop and main
# (.github/rulesets). develop's merge queue evaluates it on its temporary
# gh-readonly-queue/... ref, so the workflow also triggers on merge_group; a
# queue entry has no title or body of its own (the text was checked when the
# pull request was), so the job is skipped there, and a skipped job counts as a
# pass for a required check.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main, develop]
  merge_group:
    branches: [develop]

permissions: {}

concurrency:
  group: commit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate commit and PR text
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so every commit of the PR range can be read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A policy that silently passes everything is worse than none: prove the
      # script still fails what it must before trusting it with this PR.
      - name: Self-test the policy script
        shell: pwsh
        run: ./tools/policy/test_check_text_policy.ps1

      - name: Check the PR title, the PR body and every commit message
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Join-Path $PWD 'tools/policy/check_text_policy.ps1'
          $failed = $false

          & $policy -Text ([string]$env:PR_TITLE) -Label 'PR title'
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          & $policy -Text ([string]$env:PR_BODY) -Label 'PR body'
          if ($LASTEXITCODE -ne 0) { $failed = $true }

          # Commits the PR adds to its base: reachable from the head, not from
          # the base. A merge of the base into the branch is in both, so only
          # the PR's own commits (and merge commits it created) are listed.
          $shas = @(git rev-list --reverse "$($env:BASE_SHA)..$($env:HEAD_SHA)")
          if ($LASTEXITCODE -ne 0) { throw "git rev-list failed for $($env:BASE_SHA)..$($env:HEAD_SHA)" }
          Write-Host "Checking $($shas.Count) commit message(s) in $($env:BASE_SHA)..$($env:HEAD_SHA)"
          foreach ($sha in $shas) {
              $message = (git log -1 --format=%B $sha) -join "`n"
              & $policy -Text $message -Label "commit $($sha.Substring(0, 12))"
              if ($LASTEXITCODE -ne 0) { $failed = $true }
          }

          if ($failed) { exit 1 }
          Write-Host 'OK: no attribution in the PR title, the PR body or any commit message.'
