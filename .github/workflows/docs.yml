name: Docs

# Builds the documentation site and puts it where readers find it (docs/ci.md, "Publishing").
#
#  - The site is the /adl/ section of the company site. A push to main (the release bot's fast-forward after a
#    release; a push made with an App token starts workflows, one made with GITHUB_TOKEN does not) deploys it, and a pull
#    request that changes the documentation gets a preview at /_preview/adl/pr-<number>/, commented on the pull request
#    and removed when it closes. The deploy is the shared reusable workflow of icl-common-infra: it assumes a role by
#    OIDC that may write this section only, from four repository secrets that the owner sets. A run that does not have
#    them skips the deploy with a warning and does not fail, so this workflow is safe before the company site has the
#    role for this repository.
#  - GitHub Pages still serves a small page at each address of the first site, pointing to the page's new address
#    (tools/docs/make_old_address_stubs.py). That waits for the repository variable PUBLISH_DOCS = true, which is set
#    once Pages is switched on (docs/releasing.md, "Setup"), so that a repository without Pages does not get a red run on
#    every release. It uses the Pages "GitHub Actions" source and not a gh-pages branch.
#
# The strict build that gates a change is the `Docs build (strict)` job of ci.yml; this workflow builds the same site
# again with the same checks, because the deploy needs the built site as an artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CMakeLists.txt"
      - "packaging/linux/icons/adl_app.svg"
      - "tools/docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/docs-site/**"
      - ".github/requirements/docs.*"
  workflow_dispatch:

# Two builds of main must not publish at once. A newer push to a pull request replaces the older preview run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build the site and the old-address pages
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docs-site

      # The site as built, for the deploy job (the reusable workflow reads an artifact of this name and wants an
      # index.html at its top level).
      - name: Keep the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 7

      # What GitHub Pages serves is the pages that forward, not the site: the site's address is the company's.
      - name: Write the pages that forward the old addresses
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 tools/docs/make_old_address_stubs.py --out old-addresses

      - name: Package the pages for Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: old-addresses

  # Production: only from main. The reusable workflow refuses any other ref, and this condition keeps a manual run of
  # another branch from showing a red job for it.
  deploy:
    name: Deploy the site
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@54f3b7ecd95fa07034f6f50a057c537ee98cd30d # v0.1.28
    with:
      prefix: adl
      production-ref: refs/heads/main
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  deploy-failed:
    name: Say why the deploy failed
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain
        run: |
          {
            echo "## The site was not deployed"
            echo
            echo "The usual cause is the role: its trust policy has to allow a push to main of this repository, which"
            echo "needs the entry for this repository in the company site's apps.ts (slug adl, publishRef main) and a"
            echo "cdk deploy by the owner. Then run this workflow again from main. docs/ci.md, \"Publishing\", lists the steps."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The site was not deployed. See the run summary; the role or its trust policy is the usual cause."

  # A preview of a pull request from this repository (a fork has no secrets, and the reusable workflow skips it).
  preview:
    name: Deploy a preview
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@54f3b7ecd95fa07034f6f50a057c537ee98cd30d # v0.1.28
    with:
      prefix: adl
      preview: true
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  remove-preview:
    name: Remove a preview
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@54f3b7ecd95fa07034f6f50a057c537ee98cd30d # v0.1.28
    with:
      mode: remove-preview
      prefix: adl
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  publish:
    name: Publish the old addresses
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
