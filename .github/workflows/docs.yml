name: Docs

# Publishes the old documentation address on GitHub Pages (docs/ci.md, "Documentation site"). The documentation is
# now at https://iainchesworthlabs.com/adl/; this workflow builds the site strictly (the same build and checks as the
# `Docs build (strict)` job of ci.yml) and publishes a small page at each address of the first site, pointing to where
# the page went (tools/docs/make_old_address_stubs.py), so a link made while Pages was the site still arrives. The
# release bot's fast-forward of main after a release starts it (a push made with an App token starts workflows; one
# made with GITHUB_TOKEN does not). Deploying the site itself to iainchesworthlabs.com is not in this workflow: it needs
# the company site's role for this repository first (docs/ci.md, "Publishing").
#
# Publishing uses the Pages "GitHub Actions" source and not a gh-pages branch. It waits for the
# repository variable PUBLISH_DOCS = true, which is set once Pages is switched on (docs/releasing.md,
# "One-time setup"), so that a repository without Pages does not get a red run on every release.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two builds of main must not publish at once.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build the site and the old-address pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docs-site

      # What Pages serves is the pages that forward, not the site: the site's address is the company's.
      - name: Write the pages that forward the old addresses
        run: python3 tools/docs/make_old_address_stubs.py --out old-addresses

      - name: Package the pages for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: old-addresses

  publish:
    name: Publish the site
    if: ${{ github.ref == 'refs/heads/main' && vars.PUBLISH_DOCS == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
