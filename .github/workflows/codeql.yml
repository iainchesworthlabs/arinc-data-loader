name: CodeQL

# Code scanning by the shared workflow of icl-common-infra, nightly and on demand. It has no pull
# request trigger, so an alert is triaged under Security > Code scanning and never blocks a merge,
# and no merge_group trigger, so a queue entry does not spend a CodeQL build. A failed analysis opens or
# updates the nightly-analysis issue. The C++ build is the lean one of the `linux-codeql` preset (the
# libraries and the platform layer; docs/static-analysis.md). The rest of the nightly suite is
# static-analysis.yml.

on:
  schedule:
    # 13:17 UTC, the same night as static-analysis.yml. GitHub's cron is UTC.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@320b0f8af8036ac854a5f33a5ee9df96b164b866 # v0.1.11
    with:
      runner: '["ubuntu-26.04"]'
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-codeql", "vcpkg": false},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]
