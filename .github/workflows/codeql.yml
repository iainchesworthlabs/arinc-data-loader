name: CodeQL

# Code scanning by the shared workflow of icl-common-infra, nightly, on demand and on a ready pull
# request that changes what it scans. It is not a required check, so an alert is triaged under
# Security > Code scanning and never blocks a merge, and it has no merge_group trigger, so a queue
# entry does not spend a CodeQL build. A failed nightly analysis opens or updates the
# nightly-analysis issue. The C++ build is the lean one of the `linux-codeql` preset (the libraries
# and the platform layer; docs/static-analysis.md). The rest of the nightly suite is
# static-analysis.yml.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "apps/**"
      - "cmake/**"
      - "libs/**"
      - "tools/**"
      - "vcpkg.json"
  schedule:
    # 13:17 UTC, the same night as static-analysis.yml. GitHub's cron is UTC.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

# A newer push to a pull request supersedes the older analysis; a nightly or manual run is never
# cancelled by a pull request.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    # Dependabot's pull requests get a read-only token, which cannot upload the results.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.actor != 'dependabot[bot]')
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@0077552990ba3d132d2737e80cb2bcd5e1aeee31 # v0.1.12
    with:
      runner: '["ubuntu-26.04"]'
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-codeql", "vcpkg": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]
