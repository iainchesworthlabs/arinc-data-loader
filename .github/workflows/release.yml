name: Release

# Builds the Release configuration on the three desktops, runs every test tier against it, packages,
# and writes the SBOM. For a version tag the shared publish workflow then writes SHA512SUMS, signs,
# attests, runs tools/release/verify_release.sh over the result and drafts a GitHub release for the
# maintainer to read and publish. The process and the one-time setup are in docs/releasing.md; how a
# downloader checks the result is docs/verifying-releases.md.
#
#   push of a tag vX.Y.Z[-suffix]  a release: everything below. The environment `release` holds the
#                                  publish job until the maintainer approves it.
#   workflow_dispatch              a rehearsal on the branch it is run on (`gh workflow run release.yml
#                                  --ref <branch>`): builds, tests, packages and writes the SBOM, and
#                                  publishes nothing.
#   pull_request                   the same rehearsal, when a change touches the packaging or this
#                                  workflow.
#
# The signing key and the release bot's key are organisation secrets that only the shared publish
# workflow reads, in the `release` environment. Nothing runs on pull_request_target, and pull request
# data reaches scripts through the environment, never by interpolation into a shell.

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/release.yml"
      - ".github/actions/install-qt/**"
      - ".github/requirements/qt*"
      - ".github/requirements/sbom*"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "packaging/**"
      - "tests/packaging/**"
      - "libs/platform/*/platform.cmake"
      - "tools/release/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A release run is never cancelled half way; a pull request's is replaced by its next push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # What is being released. For a tag: that it is semantic, that CMakeLists.txt and vcpkg.json carry
  # its version, and that the release has notes. Otherwise the project's version, for a rehearsal.
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with the project version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"

      - name: Work out the version
        id: info
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SIGN_WINDOWS: ${{ vars.SIGN_WINDOWS || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(awk '/^project\(/ { in_project = 1 } in_project && $1 == "VERSION" { print $2; exit }' CMakeLists.txt)"
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Check the release has notes
        if: github.ref_type == 'tag'
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          version: ${{ steps.info.outputs.version }}
          prerelease: ${{ steps.info.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  # Configure, build, test (every tier) and package the Release preset on one desktop, then start the
  # programs from the unpacked packages with no Qt about.
  build:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            name: Windows (MSVC, Release)
            os: windows-2025-vs2026
            preset: windows-msvc-release
            triplet: x64-windows
            qt_host: windows
            qt_arch: win64_msvc2022_64
          - leg: linux
            name: Linux (GCC, Release)
            os: ubuntu-26.04
            preset: linux-gcc-release
            triplet: x64-linux
            qt_host: linux
            qt_arch: linux_gcc_64
          - leg: macos
            name: macOS (AppleClang, Release)
            os: macos-26
            preset: macos-clang-release
            triplet: arm64-osx
            qt_host: mac
            qt_arch: clang_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13

      - name: Install CMake 4 + Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: "4.4.2"
          ninjaVersion: "1.13.2"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Show the toolchain
        shell: bash
        run: |
          cmake --version | head -n 1
          ninja --version
          case "$RUNNER_OS" in
            Linux) g++ --version | head -n 1 ;;
            macOS) c++ --version | head -n 1; sw_vers ;;
            Windows) cl 2>&1 | head -n 1 || true ;;
          esac

      - name: Install Qt
        uses: ./.github/actions/install-qt
        with:
          version: "6.12.0"
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}

      - name: Configure
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cmake --preset "$CMAKE_PRESET" -DADL_BUILD_APP=ON "-DADL_RELEASE_VERSION=$RELEASE_VERSION"

      - name: Build
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$CMAKE_PRESET"

      # Every tier (unit, integration, system, and the UI suite) against the optimised build, the one
      # that is shipped; the Debug legs of ci.yml never compile it. system.install_consumer builds a
      # program against the installed development component.
      - name: Test
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: ctest --preset "$CMAKE_PRESET"

      - name: List the Windows programs
        id: programs
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          $programs = 'adl_app', 'adl_media_gen', 'adl_mock_target', 'adl_write_payloads'
          $files = ($programs | ForEach-Object { (Resolve-Path "build/$env:CMAKE_PRESET/bin/$_.exe").Path }) -join "`n"
          "files<<EOF`n$files`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The programs are signed where they are built; CPack copies them from there. SIGN_WINDOWS is
      # false (nothing signed), test (the organisation's test certificate) or production (not set up).
      # The runtime package then carries -unsigned or -testsigned in its name.
      - name: Sign the Windows programs
        id: sign
        if: runner.os == 'Windows'
        uses: iainchesworthlabs/icl-common-infra/actions/sign-windows@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
        with:
          mode: ${{ vars.SIGN_WINDOWS || 'false' }}
          files: ${{ steps.programs.outputs.files }}
          rename: "false"
          pfx-base64: ${{ secrets.WIN_TESTSIGN_PFX_BASE64 }}
          pfx-password: ${{ secrets.WIN_TESTSIGN_PFX_PASSWORD }}

      - name: Package
        shell: bash
        env:
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          (cd "build/$CMAKE_PRESET" && cpack -B packages)
          mkdir dist
          find "build/$CMAKE_PRESET/packages" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Name the Windows package for how it was signed
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SUFFIX: ${{ steps.sign.outputs.suffix }}
        run: |
          Get-ChildItem dist -Filter 'arinc-data-loader-*.zip' | Where-Object { $_.Name -notlike 'arinc-data-loader-dev-*' } |
              ForEach-Object { Rename-Item -LiteralPath $_.FullName -NewName ($_.BaseName + $env:SUFFIX + $_.Extension) }
          Get-ChildItem dist | Select-Object Name, Length

      # What the build's own tests cannot show: that a package works where the Qt kit is not. Each
      # runtime package is unpacked into an empty directory and its programs started from there;
      # each development package is unpacked and a program is built against it.
      - name: Test the packages
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem dist -File) {
              ./tools/release/Test-Package.ps1 -Package $package.FullName -Settle 5
              if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Record what was built with
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
          CMAKE_PRESET: ${{ matrix.preset }}
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" -I tools/release/collect_build_info.py --leg "$LEG" --build-dir "build/$CMAKE_PRESET" \
            --packages dist --qt-root "$QT_ROOT_DIR" --out info

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.leg }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build information
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info-${{ matrix.leg }}
          path: info
          if-no-files-found: error
          retention-days: 30

      # Saved even when a later step fails - see ci.yml.
      - name: Save the vcpkg caches
        if: ${{ always() }}
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13

  # The software bill of materials (SPDX and CycloneDX, checked against their schemas), and the
  # directory of files that is signed and published.
  assemble:
    name: SBOM
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Download the build information
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-info-*
          merge-multiple: true
          path: info

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install the SBOM validators (hash-locked)
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/sbom-venv"
          uv pip install --python "$RUNNER_TEMP/sbom-venv/bin/python" --require-hashes --no-build --requirement .github/requirements/sbom.txt

      - name: Write the SBOM
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir release
          created="$(TZ=UTC git show -s --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd "$COMMIT")"
          python3 -I tools/release/make_sbom.py --version "$VERSION" --tag "$TAG" --commit "$COMMIT" \
            --created "$created" --packages dist --build-info info --out release
          cp dist/* release/
          # The public key travels with the release for convenience; what it is trusted by is its
          # fingerprint, which a downloader compares with SECURITY.md (docs/verifying-releases.md).
          cp docs/signing-key.asc release/arinc-data-loader-release-key.pgp
          "$RUNNER_TEMP/sbom-venv/bin/python" -I tools/release/validate_sbom.py \
            "release/arinc-data-loader-$VERSION.spdx.json" "release/arinc-data-loader-$VERSION.cdx.json"
          # Every typeface the programs embed must be in the bill of materials.
          python3 -I tools/release/check_sbom_fonts.py "release/arinc-data-loader-$VERSION.spdx.json" libs/ui/fonts
          ls -l release

      - name: Upload the files to sign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release
          if-no-files-found: error
          retention-days: 30

  # The software bill of materials attested as describing the packages (the shared publish workflow
  # attests where each file came from).
  attest-sbom:
    name: Attest the SBOM
    if: github.ref_type == 'tag'
    needs: [version, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/arinc-data-loader-*.zip
            release/arinc-data-loader-*.tar.gz
            release/arinc-data-loader-*.dmg
          sbom-path: release/arinc-data-loader-${{ needs.version.outputs.version }}.spdx.json

  # SHA512SUMS, the signatures, build provenance, tools/release/verify_release.sh and a draft GitHub
  # release, then, for a version without a suffix, main moved to the tag. The project's own SBOMs are
  # in the files, so the shared job writes none.
  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [version, assemble, attest-sbom]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@3e3b4da9b7808f4f0643eecf03134918fb67b082 # v0.1.13
    with:
      generate-sbom: false
      public-key: docs/signing-key.asc
      verify-script: tools/release/verify_release.sh
      draft: true
      title: ARINC Data Loader ${{ needs.version.outputs.version }}
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
