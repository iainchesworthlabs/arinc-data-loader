# SonarQube / SonarQube Cloud settings for the optional nightly scan
# (.github/workflows/static-analysis.yml). The job is skipped until the
# repository variable SONAR_HOST_URL and the SONAR_TOKEN secret are set; see
# docs/static-analysis.md.
#
# The project key and organization are the SonarQube Cloud ones. A
# self-hosted server uses its own key and removes sonar.organization (only
# SonarQube Cloud has organizations).
sonar.projectKey=iainchesworthlabs_arinc-data-loader
sonar.organization=iainchesworthlabs
sonar.projectName=ARINC Data Loader

# The C++ analyzer reads the compilation database instead of wrapping the
# build: the linux-gcc-sonar preset is configure-only and writes it there.
sonar.sources=src
sonar.cfamily.compile-commands=build/linux-gcc-sonar/compile_commands.json

sonar.sourceEncoding=UTF-8
# The standards are not this project's to publish, and the vendored dependency
# provider is not this project's code.
sonar.exclusions=docs/specs/**,deps/**,build/**
