# The smallest configuration the platform layer runs in: C++23 on the SDK's libstdc++ and
# picolibc, no exceptions and no RTTI, Zephyr's IPv4/UDP stack over its loopback interface.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

CONFIG_ADL_PLATFORM=y
CONFIG_ADL_WARNINGS_AS_ERRORS=y
CONFIG_ADL_HEAP_BYTES=262144
CONFIG_ADL_THREAD_STACK_BYTES=2048
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_ZVFS_POLL_MAX=8

# The platform layer depends on a file system being configured; the smoke test mounts none.
CONFIG_FILE_SYSTEM=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_LOG=n

# The network stack draws random port numbers; QEMU has no entropy device for it.
CONFIG_TEST_RANDOM_GENERATOR=y
