# C++23 with the host's standard library (native_sim links the host's libstdc++); Catch2 needs
# exceptions and RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

# Catch2 runs on the main thread, and the 615A engine tests build large buffers on it.
CONFIG_MAIN_STACK_SIZE=262144
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# The platform layer under test.
CONFIG_ADL_PLATFORM=y
CONFIG_ADL_HEAP_BYTES=2097152
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_ZVFS_POLL_MAX=64

# Files: littlefs on the simulated flash, mounted at /lfs by main.cpp.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=16
CONFIG_FS_LITTLEFS_NUM_DIRS=8
CONFIG_FS_LITTLEFS_CACHE_SIZE=512
CONFIG_FS_LITTLEFS_READ_SIZE=64
CONFIG_FS_LITTLEFS_PROG_SIZE=64
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=128
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=65536

# Network: Zephyr's own IPv4/UDP stack over its loopback interface, so that the tests need no
# tap device and no privilege. A 65468 byte datagram is one loopback packet.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_LOOPBACK_MTU=65535
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_BUF_RX_COUNT=600
CONFIG_NET_BUF_TX_COUNT=600
CONFIG_NET_LOG=n
