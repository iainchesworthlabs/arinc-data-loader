# A Cortex-A9 under QEMU, built with the Zephyr SDK's GCC and picolibc: the same program as on
# native_sim, on a real architecture and C library.
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=33554432
CONFIG_TEST_RANDOM_GENERATOR=y
# GCC 14 at -O2 warns in the libraries (-Wnull-dereference on an inlined allocation).
CONFIG_ADL_WARNINGS_AS_ERRORS=n
# Catch2 and libstdc++'s streams ask the C library for open, read, write, fstat, gettimeofday...:
# Zephyr's POSIX layer answers.
CONFIG_POSIX_API=y
# The board runs with its MMU on, and the kernel's virtual address space (8 MB by default) has to
# hold the whole image: this one is 26 MB, mostly buffers, and without room device mappings panic
# before the console is up.
CONFIG_KERNEL_VM_SIZE=0x8000000
